<script>
  const bgMusic = document.getElementById("bgMusic");

  document.addEventListener("click", () => {
    bgMusic.play();
  }, { once: true });
<script>
window.addEventListener("load", () => {
  const search = document.getElementById("search");
  const sort = document.getElementById("sort");
  const container = document.querySelector(".container");
  const movies = Array.from(document.querySelectorAll(".movie"));

  movies.forEach((movie, index) => {
    movie.dataset.favorite = index;

    movie.addEventListener("click", () => {
      sessionStorage.setItem("movieScroll", window.scrollY);
    });
  });

  const savedSort = localStorage.getItem("movieSort");
  if (savedSort) sort.value = savedSort;

  function getTitle(movie) {
    return movie.querySelector("img").alt;
  }

  function getGenre(movie) {
    return movie.dataset.genre || "Other";
  }

  function clearContainer() {
    container.innerHTML = "";
  }

  function movieMatchesSearch(movie) {
    const value = search.value.trim().toLowerCase();
    const title = getTitle(movie).toLowerCase();
    return value === "" || title.includes(value);
  }

  function showFavorites() {
    clearContainer();

    movies
      .sort((a, b) => Number(a.dataset.favorite) - Number(b.dataset.favorite))
      .forEach(movie => {
        if (movieMatchesSearch(movie)) container.appendChild(movie);
      });
  }

  function showAZ() {
    clearContainer();

    movies
      .sort((a, b) => getTitle(a).localeCompare(getTitle(b)))
      .forEach(movie => {
        if (movieMatchesSearch(movie)) container.appendChild(movie);
      });
  }

  function showGenres() {
    clearContainer();

    const genreOrder = [
      "Romance",
      "Comedy",
      "Drama",
      "Action / Thriller",
      "Sci-Fi / Fantasy",
      "Animation / Family",
      "Other"
    ];

    genreOrder.forEach(genreName => {
      const matchingMovies = movies
        .filter(movie => getGenre(movie) === genreName && movieMatchesSearch(movie))
        .sort((a, b) => getTitle(a).localeCompare(getTitle(b)));

      if (matchingMovies.length > 0) {
        const heading = document.createElement("h2");
        heading.className = "genre-heading";
        heading.textContent = genreName;
        container.appendChild(heading);

        matchingMovies.forEach(movie => container.appendChild(movie));
      }
    });
  }

  function updateMovies() {
    if (sort.value === "az") {
      showAZ();
    } else if (sort.value === "genre") {
      showGenres();
    } else {
      showFavorites();
    }
  }

  sort.addEventListener("change", () => {
    localStorage.setItem("movieSort", sort.value);
    sessionStorage.setItem("movieScroll", 0);
    updateMovies();
    window.scrollTo(0, 0);
  });

  search.addEventListener("input", () => {
    sessionStorage.setItem("movieScroll", 0);
    updateMovies();
    window.scrollTo(0, 0);
  });

  window.addEventListener("scroll", () => {
    sessionStorage.setItem("movieScroll", window.scrollY);
  });

  updateMovies();

  const savedScroll = sessionStorage.getItem("movieScroll");
  if (savedScroll !== null) {
    requestAnimationFrame(() => {
      window.scrollTo(0, Number(savedScroll));
    });
  }
});
</script>
